<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear Algebra for AI: Study Guide</title>
<style>
:root {
  --bg: #fbfbf9; --surface: #ffffff; --surface-2: #f2f2ee; --text: #1d1f23; --muted: #5d6270;
  --border: #dcdcd4; --accent: #2457c5; --accent-soft: #e6edfb; --mark: #fff3c4;
  --code-bg: #f4f4f0; --code-text: #24272e;
  --t-comment: #7a7f8a; --t-keyword: #a626a4; --t-string: #3b7d2f; --t-number: #b3541e;
  --t-builtin: #0b6fa8; --t-func: #2457c5; --t-op: #5d6270;
  --shadow: 0 8px 28px rgba(20, 24, 40, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --surface: #1c1f26; --surface-2: #232730; --text: #e6e6e3; --muted: #9aa0ad;
    --border: #2f3441; --accent: #8db0ff; --accent-soft: #232c45; --mark: #4a4222;
    --code-bg: #191c22; --code-text: #dfe1e6;
    --t-comment: #7d8494; --t-keyword: #d68cf0; --t-string: #8ccf7e; --t-number: #f0a16b;
    --t-builtin: #6cc4f2; --t-func: #8db0ff; --t-op: #9aa0ad;
    --shadow: 0 8px 28px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f26; --surface-2: #232730; --text: #e6e6e3; --muted: #9aa0ad;
  --border: #2f3441; --accent: #8db0ff; --accent-soft: #232c45; --mark: #4a4222;
  --code-bg: #191c22; --code-text: #dfe1e6;
  --t-comment: #7d8494; --t-keyword: #d68cf0; --t-string: #8ccf7e; --t-number: #f0a16b;
  --t-builtin: #6cc4f2; --t-func: #8db0ff; --t-op: #9aa0ad;
  --shadow: 0 8px 28px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* three colours used to tell attention heads apart in diagrams */
:root { --h1: #2457c5; --h2: #c76a12; --h3: #2a8a52; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --h1: #7aa2ff; --h2: #f0a45a; --h3: #5fcf8a; } }
:root[data-theme="dark"] { --h1: #7aa2ff; --h2: #f0a45a; --h3: #5fcf8a; }
.dg-h1 { fill: var(--h1); } .dg-h2 { fill: var(--h2); } .dg-h3 { fill: var(--h3); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1.25rem; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
nav#sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 1.25rem 1rem 2rem;
  border-right: 1px solid var(--border); background: var(--surface);
}
nav#sidebar h2 { font-size: 1rem; margin: 0 0 .25rem; }
nav#sidebar .sub { color: var(--muted); font-size: .8rem; margin: 0 0 1rem; }
nav#sidebar ol { list-style: none; margin: 1rem 0 0; padding: 0; }
nav#sidebar li a {
  display: block; padding: .3rem .6rem; border-radius: 6px; color: var(--text);
  text-decoration: none; font-size: .88rem; line-height: 1.35;
}
nav#sidebar li a:hover { background: var(--surface-2); }
nav#sidebar li a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.controls { display: grid; gap: .5rem; font-size: .84rem; }
.controls label { display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; color: var(--muted); }
.controls button, .menu-btn {
  font: inherit; font-size: .84rem; padding: .35rem .7rem; border-radius: 6px; cursor: pointer;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
}
.controls button:hover, .menu-btn:hover { border-color: var(--accent); }
.menu-btn { display: none; position: fixed; top: .6rem; left: .6rem; z-index: 30; }

main#content { padding: 2.5rem clamp(16px, 4vw, 3.5rem) 6rem; max-width: 62rem; width: 100%; }

/* ---------- prose ---------- */
h1 { font-size: 1.85rem; line-height: 1.25; margin: 3.2rem 0 1rem; padding-top: .5rem; }
main > h1:first-child { margin-top: 0; font-size: 2.1rem; }
h2 { font-size: 1.3rem; margin: 2.2rem 0 .6rem; }
h3 { font-size: 1.1rem; margin: 1.6rem 0 .4rem; }
p, ul, ol { margin: .8rem 0; }
li { margin: .25rem 0; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0 0; }
a { color: var(--accent); }
strong { font-weight: 650; }
:not(pre) > code {
  font: .88em/1 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  background: var(--code-bg); padding: .12em .38em; border-radius: 4px; border: 1px solid var(--border);
  overflow-wrap: anywhere;
}

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-2); font-weight: 650; }
tr:last-child td { border-bottom: 0; }

/* ---------- code ---------- */
pre.hl {
  position: relative; margin: 1rem 0; padding: 2rem 1rem 1rem; overflow-x: auto;
  background: var(--code-bg); color: var(--code-text); border: 1px solid var(--border);
  border-radius: 8px; font: 13.5px/1.55 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
pre.hl::before {
  content: attr(data-lang); position: absolute; top: .45rem; left: .9rem;
  font: 600 .68rem/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
pre.hl code { font: inherit; white-space: pre; }
pre.hl .copy {
  position: absolute; top: .35rem; right: .45rem; font: inherit; font-size: .72rem;
  padding: .2rem .55rem; border-radius: 5px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer;
}
pre.hl .copy:hover { color: var(--accent); border-color: var(--accent); }
.c, .c1, .cm, .cs, .ch, .cp, .cpf { color: var(--t-comment); font-style: italic; }
.k, .kn, .kd, .kc, .kr, .kp, .kt, .ow { color: var(--t-keyword); }
.s, .s1, .s2, .sa, .sb, .sc, .sd, .se, .sh, .si, .sx, .sr, .ss, .fm { color: var(--t-string); }
.m, .mi, .mf, .mh, .mo, .mb, .il { color: var(--t-number); }
.nb, .bp, .nc, .ne { color: var(--t-builtin); }
.nf, .nd { color: var(--t-func); }
.o { color: var(--t-op); }

/* ---------- glossary ---------- */
.gl-entry {
  margin: .6rem 0; padding: .1rem 1rem; border-left: 3px solid var(--border); border-radius: 0 6px 6px 0;
}
.gl-entry p { margin: .5rem 0; }
.gl-entry:target { border-left-color: var(--accent); background: var(--accent-soft); }
.gl-entry pre.hl { margin: .5rem 0; }
.gl-term { color: var(--accent); }
.gl-filter { margin: 1rem 0; }
.gl-filter input {
  width: 100%; font: inherit; padding: .55rem .8rem; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}
.gl-filter input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.gl-filter small { color: var(--muted); }
.gl-entry.hidden, h2.hidden { display: none; }

/* ---------- diagrams ---------- */
figure.diagram {
  margin: 1.2rem 0; padding: 1rem .5rem; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
}
figure.diagram svg { display: block; width: 100%; max-width: 640px; height: auto; margin: 0 auto; }
.dg-cell { fill: var(--surface); stroke: var(--muted); stroke-width: 1.3; }
.dg-back { fill: var(--surface-2); opacity: .8; }
.dg-hi { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.dg-title { fill: var(--text); font: 700 17px system-ui, sans-serif; }
.dg-sub { fill: var(--muted); font: 14px system-ui, sans-serif; }
.dg-shape { fill: var(--text); font: 700 17px ui-monospace, Menlo, Consolas, monospace; }
.dg-num { fill: var(--text); font: 600 16px system-ui, sans-serif; text-anchor: middle; }
.dg-axl { fill: var(--accent); font: 600 12.5px system-ui, sans-serif; }
.dg-axis { stroke: var(--accent); stroke-width: 1.6; }
.dg-arrowhead { fill: var(--accent); }
.dg-brace { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.dg-outline { fill: none; stroke: var(--accent); stroke-width: 3; }
.dg-box { fill: var(--surface); stroke: var(--muted); stroke-width: 1.4; }
.dg-llm { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.dg-boxt { fill: var(--text); font: 700 14px system-ui, sans-serif; }
.dg-dash { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; }
.dg-heatnum { font: 600 14px system-ui, sans-serif; }
.dg-note { fill: var(--text); font: 14px system-ui, sans-serif; white-space: pre; }
figure.diagram svg.wide { max-width: 760px; }


/* ---------- study-guide additions: symbols, matrices, equations ---------- */
var.var { font-style: normal; font-family: "Cambria Math", "STIX Two Math", Cambria, Georgia, serif; font-size: 1.05em; padding: 0 .06em; }
var.var-it { font-style: italic; }
var.var sup { font-size: .7em; }
.eq {
  margin: 1rem 0; padding: .8rem 1rem; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; text-align: center; font: 1.12rem/2.2 "Cambria Math", "STIX Two Math", Cambria, Georgia, serif;
  overflow-x: auto;
}
.eq .lbl { display: block; font: .78rem/1.3 system-ui, sans-serif; color: var(--muted); text-align: left; margin-bottom: .2rem; }
.mx {
  display: inline-grid; grid-template-columns: repeat(var(--cols), auto); gap: .1rem .75rem; vertical-align: middle;
  padding: .15rem .5rem; margin: .15rem .2rem; border-left: 2px solid var(--text); border-right: 2px solid var(--text);
  border-radius: 0; text-align: center; line-height: 1.5; font-family: "Cambria Math", Cambria, Georgia, serif;
  font-variant-numeric: tabular-nums; position: relative;
}
.mx::before, .mx::after { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; border: 2px solid var(--text); }
.mx::before { left: -2px; border-right: 0; } .mx::after { right: -2px; border-left: 0; }
.mx > span { min-width: 1.1em; }
.recipe { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; padding: .2rem 1rem; background: var(--surface); margin: 1rem 0; }
.recipe > p:first-child { font-weight: 650; color: var(--accent); margin-bottom: .2rem; }
.why { border-left: 4px solid var(--h2); padding: .2rem 1rem; background: var(--surface-2); border-radius: 0 8px 8px 0; margin: 1rem 0; }
.why > p:first-child::before { content: "Why it is used: "; font-weight: 650; color: var(--h2); }
details.practice { margin: 1rem 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
details.practice > summary { cursor: pointer; padding: .55rem 1rem; font-weight: 650; color: var(--accent); }
details.practice > summary:hover { background: var(--surface-2); }
details.practice[open] > summary { border-bottom: 1px solid var(--border); }
details.practice > div { padding: .2rem 1rem .6rem; }
.problem { border: 1px solid var(--border); border-radius: 10px; padding: .4rem 1.1rem .6rem; margin: 1.2rem 0; background: var(--surface-2); }
.problem > p:first-child { font-weight: 650; }

/* ---------- diagrams: extra classes ---------- */
.dg-grid { stroke: var(--border); stroke-width: 1; }
.dg-vec { stroke: var(--h1); stroke-width: 3; }
.dg-vec2 { stroke: var(--h2); stroke-width: 3; }
.dg-arrowhead2 { fill: var(--h2); }
.dg-dot { fill: var(--h1); }
.dg-cell.dg-c1 { fill: color-mix(in srgb, var(--h1) 16%, var(--surface)); stroke: var(--h1); }
.dg-cell.dg-c2 { fill: color-mix(in srgb, var(--h2) 16%, var(--surface)); stroke: var(--h2); }
.dg-c1r { fill: color-mix(in srgb, var(--h1) 35%, var(--surface)); stroke: var(--h1); stroke-width: 1.5; }
.dg-c2r { fill: color-mix(in srgb, var(--h2) 35%, var(--surface)); stroke: var(--h2); stroke-width: 1.5; }
.dg-area { fill: color-mix(in srgb, var(--h3) 22%, transparent); stroke: var(--h3); stroke-width: 1.6; }
.dg-back { stroke: var(--h2); stroke-width: 1.8; stroke-dasharray: 6 4; }
.dg-back-t { fill: var(--h2); font: 600 13.5px system-ui, sans-serif; }

/* ---------- interactive widgets ---------- */
.widget { margin: 1.4rem 0; padding: 1rem 1.1rem 1.1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.widget h4 { margin: 0 0 .2rem; font-size: 1rem; }
.widget .hint { color: var(--muted); font-size: .85rem; margin: 0 0 .8rem; }
.widget .row { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: .6rem 0; }
.widget .wmx { display: inline-grid; gap: 4px; padding: 4px 8px; border-left: 2px solid var(--text); border-right: 2px solid var(--text); }
.widget input[type=number] {
  width: 3.6rem; font: inherit; font-size: .95rem; text-align: center; padding: .25rem; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
}
.widget input[type=number]:focus { outline: 2px solid var(--accent); }
.widget .cellbtn {
  min-width: 3.6rem; font: inherit; padding: .25rem .4rem; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums;
}
.widget .on { background: var(--accent-soft) !important; outline: 2px solid var(--accent); }
.widget .on2 { background: color-mix(in srgb, var(--h2) 20%, var(--surface-2)) !important; outline: 2px solid var(--h2); }
.widget .out { font: .95rem/1.6 ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem; overflow-x: auto; white-space: pre-wrap; }
.widget .op { font-size: 1.3rem; color: var(--muted); }
.widget button.preset { font: inherit; font-size: .82rem; padding: .3rem .6rem; border-radius: 6px; cursor: pointer; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.widget button.preset:hover { border-color: var(--accent); }
.widget label.sl { display: grid; grid-template-columns: 2.2rem 1fr 3rem; align-items: center; gap: .5rem; font-size: .9rem; min-width: 13rem; flex: 1 1 40%; }
.widget label.sl input { width: 100%; accent-color: var(--accent); }
.widget svg { width: 100%; height: auto; display: block; max-width: 420px; margin: .4rem auto; touch-action: none; }
.widget .bars { display: grid; gap: .35rem; margin: .6rem 0; }
.widget .bar { display: grid; grid-template-columns: 6.5rem 1fr 4rem; gap: .6rem; align-items: center; font-size: .9rem; }
.widget .bar .track { height: 18px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
.widget .bar .fill { height: 100%; background: var(--accent); transition: width .15s; }
.widget .stat { display: inline-block; padding: .2rem .6rem; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font-size: .9rem; margin: .15rem .3rem .15rem 0; }
.widget .warn { color: var(--h2); font-weight: 600; }

/* ---------- tooltip triggers ---------- */
.term {
  text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px;
  text-underline-offset: 3px; cursor: help; border-radius: 3px;
}
.term:hover, .term:focus-visible, .term.open { background: var(--accent-soft); outline: none; }
body.no-terms .term { text-decoration: none; background: none; cursor: auto; }

#tip {
  position: fixed; z-index: 100; max-width: min(26rem, calc(100vw - 24px));
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-top: 3px solid var(--accent); border-radius: 8px; box-shadow: var(--shadow);
  padding: .7rem .95rem .75rem; font-size: .9rem; line-height: 1.5;
  opacity: 0; visibility: hidden; transition: opacity .12s;
}
#tip.show { opacity: 1; visibility: visible; }
#tip .tip-title { font-weight: 700; color: var(--accent); margin-bottom: .2rem; }
#tip p { margin: .35rem 0; }
#tip pre.hl { margin: .4rem 0; padding: .6rem .7rem; font-size: 12px; }
#tip pre.hl::before, #tip pre.hl .copy { display: none; }
#tip .tip-link { display: inline-block; margin-top: .25rem; font-size: .8rem; }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav#sidebar {
    position: fixed; z-index: 20; inset: 0 auto 0 0; width: min(300px, 86vw); transform: translateX(-102%);
    transition: transform .2s; box-shadow: var(--shadow);
  }
  body.nav-open nav#sidebar { transform: none; }
  .menu-btn { display: block; }
  main#content { padding-top: 3.5rem; }
}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="Toggle contents">☰ Contents</button>
<div class="layout">
  <nav id="sidebar" aria-label="Table of contents">
    <h2>Linear Algebra for AI</h2>
    <p class="sub">Hover, focus or tap any <span class="term" tabindex="0" data-demo="1">dotted-underline term</span> or italic symbol such as <var class="term var var-it" tabindex="0" data-id="var-W">W</var> to see its definition.</p>
    <div class="controls">
      <label><input type="checkbox" id="allOcc"> Underline every occurrence (default: first in each section)</label>
      <label><input type="checkbox" id="termsOn" checked> Tooltips on</label>
      <button id="themeBtn" type="button">Toggle light / dark</button>
    </div>
    <ol id="toc"></ol>
  </nav>
  <main id="content">
__CONTENT__
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script id="glossary-data" type="application/json">__GLOSSARY__</script>
<script>
(function () {
  "use strict";

  // ---------- small helpers ----------
  function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) {} return null; }
  var slug = function (s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); };
  var main = document.getElementById("content");
  var GLOSS = JSON.parse(document.getElementById("glossary-data").textContent);
  var byId = {};
  GLOSS.forEach(function (e) { byId[e.id] = e; });

  // ---------- headings, table of contents, scroll spy ----------
  var h1s = Array.prototype.slice.call(main.querySelectorAll("h1"));
  var toc = document.getElementById("toc");
  h1s.forEach(function (h, i) {
    h.id = slug(h.textContent) || "section-" + i;
    if (i === 0) return;                      // first h1 is the page title
    var li = document.createElement("li"), a = document.createElement("a");
    a.href = "#" + h.id; a.textContent = h.textContent;
    li.appendChild(a); toc.appendChild(li);
  });
  var links = toc.querySelectorAll("a");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id); });
      });
    }, { rootMargin: "0px 0px -75% 0px" });
    h1s.slice(1).forEach(function (h) { io.observe(h); });
  }
  document.getElementById("menuBtn").addEventListener("click", function () { document.body.classList.toggle("nav-open"); });
  toc.addEventListener("click", function () { document.body.classList.remove("nav-open"); });

  // Contents list in the intro -> real links (and mark it so tooltips skip it).
  var contentsH2 = Array.prototype.find.call(main.querySelectorAll("h2"), function (h) { return h.textContent.trim() === "Contents"; });
  if (contentsH2 && contentsH2.nextElementSibling && contentsH2.nextElementSibling.tagName === "UL") {
    var ul = contentsH2.nextElementSibling; ul.classList.add("toc-list");
    ul.querySelectorAll("li").forEach(function (li) {
      var t = li.textContent.trim();
      var target = h1s.find(function (h) { return h.textContent.trim() === t; });
      if (target) { li.innerHTML = '<a href="#' + target.id + '">' + li.innerHTML + "</a>"; }
    });
  }

  // ---------- theme ----------
  var root = document.documentElement;
  var savedTheme = store("la-theme"); if (savedTheme) root.setAttribute("data-theme", savedTheme);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark"; root.setAttribute("data-theme", next); store("la-theme", next);
  });

  // ---------- copy buttons ----------
  main.querySelectorAll("pre.hl").forEach(function (pre) {
    var b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copy";
    b.addEventListener("click", function () {
      var text = pre.querySelector("code").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
        b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1200);
      }, function () { b.textContent = "Press Ctrl+C"; setTimeout(function () { b.textContent = "Copy"; }, 1500); });
    });
    pre.appendChild(b);
  });

  // ---------- glossary filter box ----------
  var glH1 = h1s.find(function (h) { return /^Part 0: Glossary/.test(h.textContent); });
  if (glH1) {
    var box = document.createElement("div"); box.className = "gl-filter";

        "u · w = " + f(u[0], 2) + "×" + f(w[0], 2) + " + " + f(u[1], 2) + "×" + f(w[1], 2) + " = " + f(d, 2) + "   " + sign + "\n" +
        "‖u‖ ‖w‖ cos θ = " + f(nu, 2) + " × " + f(nw, 2) + " × " + f(cos, 3) + " = " + f(d, 2) + "   (same number)\n" +
        "cosine similarity = " + f(cos, 3) + "    angle θ = " + f(th, 1) + "°";
    }
    draw();
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }

  // --------------------------------------------------------------- softmax
  function softmax(root) {
    var z = [2, 1, 0, -1], tau = 1;
    root.appendChild(el("h4", { text: "Softmax with temperature" }));
    root.appendChild(el("p", { class: "hint", text: "Edit the scores (logits) and move the temperature τ. Low τ sharpens toward the largest score; high τ flattens toward equal weights. The order never changes, and the weights always add to 1." }));
    var row = el("div", { class: "row" }), bars = el("div", { class: "bars" }), out = el("div", { class: "out" });
    var inps = z.map(function (v, i) {
      var inp = el("input", { type: "number", step: "any", value: v, "aria-label": "score " + (i + 1) });
      inp.addEventListener("input", function () { var n = parseFloat(inp.value); z[i] = isNaN(n) ? 0 : n; draw(); });
      row.appendChild(el("label", {}, ["z" + "₁₂₃₄"[i] + " ", inp])); return inp;
    });
    var t = el("input", { type: "range", min: "0.1", max: "5", step: "0.1", value: tau, "aria-label": "temperature" }), tv = el("span", { text: "1" });
    t.addEventListener("input", function () { tau = parseFloat(t.value); tv.textContent = f(tau, 1); draw(); });
    root.appendChild(row); root.appendChild(el("div", { class: "row" }, [el("label", { class: "sl" }, [el("b", { text: "τ" }), t, tv])]));
    root.appendChild(bars); root.appendChild(out);
    function draw() {
      var m = Math.max.apply(null, z), e = z.map(function (v) { return Math.exp((v - m) / tau); }), S = e.reduce(function (a, b) { return a + b; }, 0);
      bars.innerHTML = "";
      e.forEach(function (v, i) {
        var p = v / S;
        bars.appendChild(el("div", { class: "bar" }, [el("span", { text: "z" + "₁₂₃₄"[i] + " = " + f(z[i], 2) }),
          el("div", { class: "track" }, [el("div", { class: "fill", style: "width:" + (p * 100).toFixed(1) + "%" })]), el("span", { text: f(p, 3) })]));
      });
      out.textContent = "1. divide by τ:       [" + z.map(function (v) { return f(v / tau, 2); }).join(", ") + "]\n" +
        "2. subtract the max:  [" + z.map(function (v) { return f((v - m) / tau, 2); }).join(", ") + "]   (avoids overflow; same answer)\n" +
        "3. exponentiate:      [" + e.map(function (v) { return f(v, 3); }).join(", ") + "]\n" +
        "4. divide by the sum " + f(S, 3) + " → weights add to " + f(e.reduce(function (a, b) { return a + b / S; }, 0), 3);
    }
    draw();
  }

  var REG = { matmul: matmul, transform: transform, dot: dot, softmax: softmax };
  document.querySelectorAll(".widget[data-widget]").forEach(function (w) {
    var fn = REG[w.dataset.widget];
    if (fn) fn(w); else w.textContent = "Unknown widget: " + w.dataset.widget;
  });
})();
</script>
</body>
</html>
